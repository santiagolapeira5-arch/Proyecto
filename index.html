<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="encabezado">
    <h1>Mi Agenda</h1>
    <p>Organiza tus pendientes de forma sencilla</p>
  </header>

  <div class="contenedor">
    <aside class="menu">
      <h2>Mis tareas</h2>
      <button class="opcion seleccionada" onclick="mostrarTareas('todas')">Todas</button>
      <button class="opcion" onclick="mostrarTareas('hoy')">Para hoy</button>
      <button class="opcion" onclick="mostrarTareas('pendientes')">Pendientes</button>
      <button class="opcion" onclick="mostrarTareas('completadas')">Completadas</button>
    </aside>

    <main class="contenido">
      <section class="formulario">
        <h2>Agregar una tarea</h2>
        <input type="text" id="nombreTarea" placeholder="¿Qué tienes que hacer?">
        <input type="date" id="fechaTarea">
        <button onclick="agregarTarea()">Agregar</button>
      </section>

      <section class="lista">
        <h2 id="tituloLista">Todas mis tareas</h2>
        <div id="tareas"></div>
        <p id="mensajeVacio">No hay tareas para mostrar.</p>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
